<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Netflix Landing page</title>
</head>
<body>

    <header class="navBar">
    <!-- Navigation Bar -->
    <img src="./assets/Logonetflix.png" alt="Netflix logo" class="logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="movie.html">Movies</a>
        <a href="#tvShows">TV Shows</a>
        <a href="#plans">Plans</a>
        <a href="#moretowatch">More to Watch</a>
    </nav>

    </div>

     <div class="lang">
        <select id="lang" name="language">
             <option value="disabled selected">Select Language</option>
             <option>English</option>
            <option>Hindi</option>
        </select>
    </div>

    <button class="signIn">Sign In</button>
    </header>

    
    <main class="frontMain">
        <div class="main"></div>
        <div class="frontMain-content">
            <h2>Unlimited movies, <br /> shows, and more</h2>
            <h3>Starts at ₹149. Cancel at any time.</h3>

            <p>
                Ready to watch? Enter your emails to create 
                or restart your membership.
            </p>
            <form class="emailform">
                <input id="userEmail" type="email"
                placeholder="Email Address" 
                aria-label="Email Address"  
                required >  
                <!-- aria-label is used for the disable persons. -->
                 <button type="submit">Get Started ></button>

            </form>
        </div>
    </main>

</body>
</html>
